<h2 mat-dialog-title class="dialog-title">Edit User</h2>

<mat-dialog-content>
  <form [formGroup]="userForm" class="user-form">
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Email -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required />
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">
        Please enter a valid email
      </mat-error>
    </mat-form-field>

    <!-- Roles -->
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Roles</mat-label>
      <mat-chip-grid #chipGrid>
        <mat-chip-row
          *ngFor="let role of userForm.get('roles')?.value"
          (removed)="removeRole(role)">
          {{ role }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      </mat-chip-grid>
      <input
        placeholder="Add role..."
        [matChipInputFor]="chipGrid"
        [matAutocomplete]="auto"
        [formControl]="roleInputControl"
      />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="addRole($event)">
        <mat-option *ngFor="let role of filteredRoles | async" [value]="role">
          {{ role | titlecase }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <!-- Status -->
    <mat-checkbox formControlName="status">
      Active
    </mat-checkbox>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="!userForm.valid || isLoading"
  >
    <span *ngIf="!isLoading">Save Changes</span>
    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
  </button>
</mat-dialog-actions>
