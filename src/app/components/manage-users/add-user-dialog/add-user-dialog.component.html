<h2 mat-dialog-title class="dialog-title">Add New User</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="userForm" class="user-form">
    <div *ngIf="errorMessage" class="error-message">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required placeholder="Enter user email" />
      <mat-icon matSuffix>email</mat-icon>
      <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email is required</mat-error>
      <mat-error *ngIf="userForm.get('email')?.hasError('email')">Enter a valid email address</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Roles</mat-label>
      <mat-chip-grid #chipGrid>
        <mat-chip-row *ngFor="let role of userForm.get('roles')?.value" (removed)="removeRole(role)">
          {{ role }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      </mat-chip-grid>
      <input
        placeholder="Select role..."
        [matChipInputFor]="chipGrid"
        [matAutocomplete]="auto"
        [formControl]="roleInputControl"
      />
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="addRole($event)">
        <mat-option *ngFor="let role of filteredRoles | async" [value]="role">
          {{ role }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <div class="form-field" style="margin-top: 16px;">
      <mat-checkbox
        color="primary"
        formControlName="status">
        Active
      </mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="!userForm.valid || isLoading"
  >
    <span *ngIf="!isLoading">Add User</span>
    <mat-spinner *ngIf="isLoading" diameter="20" strokeWidth="3"></mat-spinner>
  </button>
</mat-dialog-actions>
