<div class="user-roles-wrapper">
  <div class="header-with-button">
    <h2>Manage Users</h2>
    <button mat-flat-button color="accent" (click)="onAddUser()">
      Add User
    </button>
  </div>

  <mat-card class="user-roles-card">
    <!-- 🔍 Search Field with Icon -->
    <div class="card-toolbar">
      <mat-form-field appearance="outline" class="search-field small" floatLabel="auto">
        <mat-label>Search Users</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          (input)="applyFilter($event)"
          placeholder="Search by email, role, status..."
        />
      </mat-form-field>
    </div>

    <!-- ⏳ Spinner overlay -->
    <div class="spinner-overlay" *ngIf="isLoading">
      <mat-progress-spinner
        mode="indeterminate"
        diameter="50"
      ></mat-progress-spinner>
    </div>

    <!-- 📋 Table content -->
    <div class="table-scroll-container" [class.blur-content]="isLoading">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z1">

        <!-- Columns -->

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let user">{{ user.roles.join(', ') | titlecase }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let user">
            <span [ngClass]="{ 'active-status': user.status, 'inactive-status': !user.status }">
              {{ user.status ? 'Active' : 'Inactive' }}
            </span>
          </td>
        </ng-container>


        <ng-container matColumnDef="created">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let user">{{ user.created | date : 'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <div class="action-buttons">
              <button mat-flat-button color="primary" (click)="onEdit(user)">Edit</button>
              <button mat-flat-button color="warn" (click)="deleteUser(user)">Delete</button>
            </div>
          </td>
        </ng-container>

        <!-- Table rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card>

  <!-- Pagination -->
  <mat-paginator [pageSizeOptions]="[10, 20, 50]" showFirstLastButtons></mat-paginator>

  <!-- Error message -->
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
